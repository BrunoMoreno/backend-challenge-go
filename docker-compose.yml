name: backend-challenge-go

services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d wagering"]
      interval: 5s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
      PERSISTENCE: 1
      DEBUG: 0
    ports:
      - "4566:4566"
    volumes:
      - localstackdata:/var/lib/localstack
      - ./deploy/localstack/init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 15s

  app:
    build: .
    environment:
      APP_ROLES: http,outbox-publisher,reference-worker
      APP_HTTP_ADDR: :8080
      APP_DATABASE_URL: postgres://wager_app:wager_app@postgres:5432/wagering?sslmode=disable
      APP_SQS_ENDPOINT: http://localstack:4566
      APP_SQS_REGION: us-east-1
      APP_KEYCLOAK_ISSUER: http://keycloak:8080/realms/wagering
      APP_KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
      APP_KEYCLOAK_CLIENT_ID: wager-api
      APP_LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  pgdata:
  localstackdata: